="#38bdf8" class="node-pulse"/><text x="498" y="68" class="tagline-text">Curated Knowledge Hub</text><text x="600" y="145" fill="url(#primaryGrad)" class="title-text" text-anchor="middle">Cloud Team Workspace &amp; Documentation</text><text x="600" y="192" class="subtitle-text" text-anchor="middle">The definitive directory for collaborative wikis, SaaS suites &amp; self-hosted open-source platforms</text><g><g filter="url(#cardShadow)" transform="translate(290, 240)"><rect width="180" height="42" x="0" y="0" fill="url(#pillGrad1)" rx="21"/><text x="90" y="26" class="pill-text" text-anchor="middle">🚀 SaaS Ecosystems</text></g><g filter="url(#cardShadow)" transform="translate(290, 240) translate(200, 0)"><rect width="200" height="42" x="0" y="0" fill="url(#pillGrad2)" rx="21"/><text x="100" y="26" class="pill-text" text-anchor="middle">⭐ Self-Hosted Wikies</text></g><g filter="url(#cardShadow)" transform="translate(290, 240) translate(420, 0)"><rect width="200" height="42" x="0" y="0" fill="url(#pillGrad3)" rx="21"/><text x="100" y="26" class="pill-text" text-anchor="middle">⚡ Real-Time Multiplayer</text></g></g><text x="600" y="325" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" text-anchor="middle">Confluence • Notion • Outline • Docmost • AppFlowy • AFFiNE • BookStack • Wiki.js • Joplin</text></g></svg>