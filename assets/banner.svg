<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.5)" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes flowStroke {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes shimmer {
        0% { opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { opacity: 0.3; }
      }
      .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
      .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 1000px 300px; }
      .floating-card-1 { animation: floatSlow1 7s ease-in-out infinite; }
      .floating-card-2 { animation: floatSlow2 8.5s ease-in-out infinite; }
      .grid-line { stroke: rgba(148, 163, 184, 0.08); stroke-width: 1; }
      .flow-path {
        stroke: url(#primaryGrad);
        stroke-width: 2.5;
        stroke-dasharray: 8, 8;
        fill: none;
        animation: flowStroke 12s linear infinite;
      }
      .node-pulse { animation: shimmer 3s ease-in-out infinite; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        fill: #38bdf8;
      }
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #f1f5f9;
      }
      .card-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 11px;
        fill: #64748b;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g class="grid-layer">
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="420" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="420" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="420" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="420" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="420" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="420" class="grid-line" />
  </g>

  <!-- Glowing Ambient Orbs (Background) -->
  <circle cx="180" cy="90" r="140" fill="#4f46e5" filter="url(#glow)" class="orb-1" />
  <circle cx="1020" cy="310" r="150" fill="#06b6d4" filter="url(#glow)" class="orb-2" />
  <circle cx="940" cy="110" r="110" fill="#db2777" opacity="0.25" filter="url(#glow)" />

  <!-- Animated Data Flow Line Connecting Architecture Nodes -->
  <path d="M 60 360 C 240 390, 320 310, 520 340 S 820 400, 1140 330" class="flow-path" />

  <!-- Dynamic Flanking Cards (Placed in the background/sides to not obstruct center text) -->
  <!-- Left Side Flow Card -->
  <g class="floating-card-1" filter="url(#cardShadow)">
    <rect x="45" y="115" width="200" height="100" rx="12" fill="url(#cardGrad1)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.2" />
    <circle cx="70" cy="145" r="12" fill="#38bdf8" opacity="0.2" />
    <path d="M 66 145 L 74 145 M 70 141 L 70 149" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="92" y="149" class="card-title">Real-Time Sync</text>
    <text x="70" y="175" class="card-desc">Collaborative Workspaces</text>
    <rect x="70" y="188" width="120" height="6" rx="3" fill="rgba(56, 189, 248, 0.2)" />
    <rect x="70" y="188" width="85" height="6" rx="3" fill="#38bdf8" />
  </g>

  <!-- Right Side Wiki Card -->
  <g class="floating-card-2" filter="url(#cardShadow)">
    <rect x="945" y="120" width="210" height="105" rx="12" fill="url(#cardGrad1)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.2" />
    <circle cx="972" cy="150" r="12" fill="#ec4899" opacity="0.2" />
    <path d="M 966 150 L 978 150 M 972 144 L 972 156" stroke="#ec4899" stroke-width="2" stroke-linecap="round" />
    <text x="994" y="154" class="card-title">Self-Hosted Hubs</text>
    <text x="972" y="180" class="card-desc">Local-First &amp; Cloud Wikies</text>
    <rect x="972" y="193" width="130" height="6" rx="3" fill="rgba(236, 72, 153, 0.2)" />
    <rect x="972" y="193" width="100" height="6" rx="3" fill="#ec4899" />
  </g>

  <!-- Dynamic Circuit Diagram Nodes (Edges & Corners) -->
  <g opacity="0.7">
    <circle cx="100" cy="340" r="5" fill="#38bdf8" class="node-pulse" />
    <circle cx="480" cy="335" r="4" fill="#818cf8" />
    <circle cx="820" cy="370" r="5" fill="#c084fc" class="node-pulse" />
    <circle cx="1120" cy="335" r="4" fill="#38bdf8" />
  </g>

  <!-- Foreground Title and Center Information (Strictly in foreground and unobscured) -->
  <g id="foreground-content">
    <!-- Top Pill / Category -->
    <rect x="465" y="48" width="270" height="30" rx="15" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="482" cy="63" r="5" fill="#38bdf8" class="node-pulse" />
    <text x="498" y="68" class="tagline-text">Curated Knowledge Hub</text>

    <!-- Main Title with Gradient fill -->
    <text x="600" y="145" text-anchor="middle" class="title-text" fill="url(#primaryGrad)">
      Cloud Team Workspace &amp; Documentation
    </text>

    <!-- Subtitle -->
    <text x="600" y="192" text-anchor="middle" class="subtitle-text">
      The definitive directory for collaborative wikis, SaaS suites &amp; self-hosted open-source platforms
    </text>

    <!-- Feature Badges / Action Pills across bottom -->
    <g transform="translate(290, 240)">
      <!-- Pill 1: SaaS Leaders -->
      <g filter="url(#cardShadow)">
        <rect x="0" y="0" width="180" height="42" rx="21" fill="url(#pillGrad1)" />
        <text x="90" y="26" text-anchor="middle" class="pill-text">🚀 SaaS Ecosystems</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g filter="url(#cardShadow)" transform="translate(200, 0)">
        <rect x="0" y="0" width="200" height="42" rx="21" fill="url(#pillGrad2)" />
        <text x="100" y="26" text-anchor="middle" class="pill-text">⭐ Self-Hosted Wikies</text>
      </g>

      <!-- Pill 3: Real-Time Sync -->
      <g filter="url(#cardShadow)" transform="translate(420, 0)">
        <rect x="0" y="0" width="200" height="42" rx="21" fill="url(#pillGrad3)" />
        <text x="100" y="26" text-anchor="middle" class="pill-text">⚡ Real-Time Multiplayer</text>
      </g>
    </g>

    <!-- Bottom Metrics summary pill -->
    <text x="600" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#64748b">
      Confluence • Notion • Outline • Docmost • AppFlowy • AFFiNE • BookStack • Wiki.js • Joplin
    </text>
  </g>
</svg>
