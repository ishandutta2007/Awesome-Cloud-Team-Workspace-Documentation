<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.5)"/></linearGradient><linearGradient id="pillGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="pillGrad2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#d946ef"/></linearGradient><linearGradient id="pillGrad3" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#14b8a6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="30"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="cardShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".45" stdDeviation="12"/></filter><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.4}50%{transform:scale(1.15) translate(20px,-15px);opacity:.65}}@keyframes floatSlow1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes floatSlow2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-1.5deg)}}@keyframes flowStroke{0%{stroke-dashoffset:200}}@keyframes shimmer{0%{opacity:.3}50%{opacity:.8}}.orb-1{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:200px 100px}.orb-2{animation:pulseOrb 10s ease-in-out infinite alternate-reverse;transform-origin:1000px 300px}.floating-card-1{animation:floatSlow1 7s ease-in-out infinite}.floating-card-2{animation:floatSlow2 8.5s ease-in-out infinite}.grid-line{stroke:rgba(148,163,184,.08);stroke-width:1}.flow-path{stroke:url(#primaryGrad);stroke-width:2.5;stroke-dasharray:8,8;fill:none;animation:flowStroke 12s linear infinite}.node-pulse{animation:shimmer 3s ease-in-out infinite}.title-text{font-weight:800;font-size:44px;letter-spacing:-.5px}.card-desc,.card-title,.pill-text,.subtitle-text,.tagline-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:500;font-size:19px;fill:#94a3b8}.card-title,.tagline-text{font-weight:600}.tagline-text{font-size:14px;letter-spacing:1.5px;text-transform:uppercase;fill:#38bdf8}.card-title{font-size:13px;fill:#f1f5f9}.card-desc{font-weight:400;font-size:11px;fill:#64748b}.pill-text{font-weight:600;font-size:12px;fill:#fff}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><g class="grid-layer"><line x1="0" x2="1200" y1="70" y2="70" class="grid-line"/><line x1="0" x2="1200" y1="140" y2="140" class="grid-line"/><line x1="0" x2="1200" y1="210" y2="210" class="grid-line"/><line x1="0" x2="1200" y1="280" y2="280" class="grid-line"/><line x1="0" x2="1200" y1="350" y2="350" class="grid-line"/><line x1="150" x2="150" y1="0" y2="420" class="grid-line"/><line x1="300" x2="300" y1="0" y2="420" class="grid-line"/><line x1="450" x2="450" y1="0" y2="420" class="grid-line"/><line x1="600" x2="600" y1="0" y2="420" class="grid-line"/><line x1="750" x2="750" y1="0" y2="420" class="grid-line"/><line x1="900" x2="900" y1="0" y2="420" class="grid-line"/><line x1="1050" x2="1050" y1="0" y2="420" class="grid-line"/></g><circle cx="180" cy="90" r="140" fill="#4f46e5" class="orb-1" filter="u